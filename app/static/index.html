<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueLink Live Operations Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        #header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
        #header h1 { margin: 0; font-size: 1.4rem; color: #ef4444; text-transform: uppercase; letter-spacing: 1px; }
        #status-pill { background: #22c55e; color: #000; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; }
        #container { display: flex; height: calc(100vh - 65px); }
        #sidebar { width: 350px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; overflow-y: auto; }
        #map { flex: 1; height: 100%; background: #090d16; }
        .alert-card { background: #0f172a; border-left: 4px solid #ef4444; padding: 12px; margin-bottom: 12px; border-radius: 4px; }
        .alert-card.sos { border-color: #ef4444; }
        .alert-card h4 { margin: 0 0 5px 0; color: #f8fafc; }
        .alert-card p { margin: 3px 0; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div id="header">
        <h1>RescueLink Command Dashboard</h1>
        <span id="status-pill">System Operational</span>
    </div>
    <div id="container">
        <div id="sidebar">
            <h3>Live Telemetry Feed</h3>
            <div id="alerts-log">
                <p style="color: #64748b; font-style: italic;">Waiting for incoming node signals...</p>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const map = L.map('map').setView([19.0760, 72.8777], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const ws = new WebSocket(`ws://${window.location.host}/ws/alerts`);
        const alertsLog = document.getElementById('alerts-log');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (alertsLog.children[0]?.tagName === 'P') {
                alertsLog.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = 'alert-card sos';
            card.innerHTML = `
                <h4>Node: ${data.device_id}</h4>
                <p><strong>Victim:</strong> ${data.victim_name || 'Unknown'}</p>
                <p><strong>Blood Group:</strong> ${data.blood_group || 'N/A'} | <strong>Allergies:</strong> ${data.critical_allergies || 'None'}</p>
                <p><strong>Coordinates:</strong> ${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)}</p>
                <p><strong>Alert Status:</strong> SOS Active</p>
            `;
            alertsLog.prepend(card);

            const marker = L.marker([data.latitude, data.longitude]).addTo(map);
            marker.bindPopup(`<b>${data.device_id}</b><br>Victim: ${data.victim_name}<br>Blood: ${data.blood_group}`).openPopup();
            map.panTo([data.latitude, data.longitude]);
        };
    </script>
</body>
</html>
