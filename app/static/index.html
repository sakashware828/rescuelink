<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RescueLink | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card-option { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; transition: transform 0.2s; }
    .card-option:hover { transform: translateY(-4px); border-color: #ef4444; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
  <div class="text-center" style="max-width: 600px;">
    <h1 class="fw-bold text-danger mb-2">RESCUELINK</h1>
    <p class="text-secondary mb-5">IoT Emergency Response & Hardware Profile Portal</p>
    
    <div class="row g-4">
      <div class="col-md-6">
        <a href="/dashboard" class="text-decoration-none">
          <div class="card card-option p-4 text-white h-100">
            <h3 class="mb-3">🚨</h3>
            <h5 class="fw-bold">Responder Portal</h5>
            <p class="small text-secondary mb-0">Live emergency alerts stream, real-time map, & medical profile lookups.</p>
          </div>
        </a>
      </div>
      <div class="col-md-6">
        <a href="/profile" class="text-decoration-none">
          <div class="card card-option p-4 text-white h-100">
            <h3 class="mb-3">👤</h3>
            <h5 class="fw-bold">Device Linker</h5>
            <p class="small text-secondary mb-0">Link or edit your hardware Node ID, passcode, and emergency contact details.</p>
          </div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
