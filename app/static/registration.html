<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink — Node Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Navigation Header -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-red-600 p-2 rounded-lg text-white font-black text-sm tracking-wider">RL</div>
      <span class="font-bold text-xl tracking-wide text-red-500 uppercase">RescueLink <span class="text-xs text-slate-400 lowercase font-normal">Registration</span></span>
    </div>
    <div class="flex space-x-4 text-sm font-semibold">
      <a href="/dashboard" class="text-slate-400 hover:text-white transition">Dashboard</a>
      <a href="/registration" class="text-red-400 border-b-2 border-red-500 pb-0.5">Registration</a>
      <a href="/profile" class="text-slate-400 hover:text-white transition">Profile</a>
    </div>
  </nav>

  <!-- Main Registration Form Container -->
  <div class="flex-1 flex justify-center items-center p-6">
    <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-8 max-w-lg w-full shadow-2xl">
      
      <div class="border-b border-slate-700 pb-4 mb-6">
        <h2 class="text-xl font-bold text-slate-100 flex items-center">
          <svg class="w-5 h-5 mr-2 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Register Hardware Node Profile
        </h2>
        <p class="text-xs text-slate-400 mt-1">Bind dynamic ESP32 telemetry hardware IDs to live user medical emergency profiles.</p>
      </div>

      <form id="regForm" class="space-y-4 text-sm">
        
        <div>
          <label class="block text-slate-300 font-semibold mb-1">Hardware Device ID <span class="text-red-500">*</span></label>
          <input type="text" id="device_id" name="device_id" placeholder="e.g. ESP32_NODE_1" required 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-slate-300 font-semibold mb-1">User Full Name <span class="text-red-500">*</span></label>
            <input type="text" id="name" name="name" placeholder="Full Name" required 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Age <span class="text-red-500">*</span></label>
            <input type="number" id="age" name="age" placeholder="Age" required 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Blood Group <span class="text-red-500">*</span></label>
            <select id="blood_group" name="blood_group" required 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-red-500 transition">
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <div>
            <label class="block text-slate-300 font-semibold mb-1">Emergency Contact <span class="text-red-500">*</span></label>
            <input type="tel" id="emergency_contact" name="emergency_contact" placeholder="+91 9876543210" required 
              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-semibold mb-1">Medical Conditions / Allergies</label>
          <textarea id="medical_conditions" name="medical_conditions" placeholder="e.g. Asthma, Penicillin allergy..." 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 transition h-24 resize-none"></textarea>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg shadow-red-600/30 mt-4 flex items-center justify-center space-x-2">
          <span id="btnText">Save & Link Hardware Profile</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const btnText = document.getElementById("btnText");
      btnText.textContent = "Linking Hardware Profile...";

      // Build JSON payload matching the Profile database model fields
      const payload = {
        device_id: document.getElementById("device_id").value.trim(),
        name: document.getElementById("name").value.trim(),
        age: parseInt(document.getElementById("age").value, 10),
        blood_group: document.getElementById("blood_group").value,
        emergency_contact: document.getElementById("emergency_contact").value.trim(),
        medical_conditions: document.getElementById("medical_conditions").value.trim()
      };

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          window.location.replace("/dashboard");
        } else {
          const errData = await res.json().catch(() => ({}));
          alert("Error registering hardware node: " + (errData.detail || "Invalid input format"));
          btnText.textContent = "Save & Link Hardware Profile";
        }
      } catch (err) {
        console.error("Registration error:", err);
        alert("Failed to communicate with backend server.");
        btnText.textContent = "Save & Link Hardware Profile";
      }
    });
  </script>
</body>
</html>
