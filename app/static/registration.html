<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink — Profile Registration</title>
  <style>
    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --error: #ef4444;
      --success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 24px;
    }

    /* Navigation Header */
    .nav-bar {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .nav-brand {
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1.2px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--primary);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    .header {
      margin-bottom: 24px;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      background-color: #fff;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    input.invalid, textarea.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .error-msg {
      font-size: 12px;
      color: var(--error);
      margin-top: 4px;
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover { background-color: var(--primary-hover); }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <nav class="nav-bar">
    <span class="nav-brand">RescueLink System</span>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/registration" class="active">Registration</a>
      <a href="/profile">Profile</a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h2>Register Profile</h2>
    </div>

    <form id="regForm" novalidate>
      <div class="form-group">
        <label for="device_id">Device ID</label>
        <input type="text" id="device_id" value="ESP32_NODE_1" placeholder="e.g. ESP32_NODE_1">
        <div class="error-msg" id="err-device_id">Device ID is required.</div>
      </div>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe">
        <div class="error-msg" id="err-name">Please enter a valid name (letters and spaces only).</div>
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="e.g. 21">
        <div class="error-msg" id="err-age">Please enter a valid positive age.</div>
      </div>

      <div class="form-group">
        <label for="blood_group">Blood Group</label>
        <input type="text" id="blood_group" placeholder="e.g. O+">
      </div>

      <div class="form-group">
        <label for="medical_conditions">Critical Allergies / Medical Conditions</label>
        <textarea id="medical_conditions" rows="2" placeholder="e.g. Penicillin allergy, Asthma"></textarea>
      </div>

      <div class="form-group">
        <label for="emergency_contact">Emergency Contact Number</label>
        <input type="tel" id="emergency_contact" placeholder="e.g. +91 98765 43210">
        <div class="error-msg" id="err-emergency_contact">Enter a valid contact number (min. 10 digits).</div>
      </div>

      <button type="submit" id="submitBtn">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Save Profile</span>
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("regForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnSpinner = document.getElementById("btnSpinner");
    const btnText = document.getElementById("btnText");

    // Clear inline errors on input
    ['device_id', 'name', 'age', 'emergency_contact'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('invalid');
        document.getElementById(`err-${id}`).style.display = 'none';
      });
    });

    function validateForm() {
      let isValid = true;
      const deviceId = document.getElementById("device_id");
      const name = document.getElementById("name");
      const age = document.getElementById("age");
      const phone = document.getElementById("emergency_contact");

      if (!deviceId.value.trim()) {
        showError(deviceId, "err-device_id");
        isValid = false;
      }

      const nameRegex = /^[A-Za-z\s'-]+$/;
      if (!name.value.trim() || !nameRegex.test(name.value.trim())) {
        showError(name, "err-name");
        isValid = false;
      }

      const ageVal = parseInt(age.value);
      if (isNaN(ageVal) || ageVal <= 0 || ageVal > 120) {
        showError(age, "err-age");
        isValid = false;
      }

      const phoneRegex = /^[+]?[(]?[0-9]{3}[)]?[-\s.]?[0-9]{3}[-\s.]?[0-9]{4,6}$/;
      if (!phone.value.trim() || !phoneRegex.test(phone.value.trim().replace(/\s+/g, ''))) {
        showError(phone, "err-emergency_contact");
        isValid = false;
      }

      return isValid;
    }

    function showError(inputEl, errorId) {
      inputEl.classList.add("invalid");
      document.getElementById(errorId).style.display = "block";
    }

    function setLoading(loading) {
      if (loading) {
        submitBtn.disabled = true;
        btnSpinner.style.display = "inline-block";
        btnText.textContent = "Saving Profile...";
      } else {
        submitBtn.disabled = false;
        btnSpinner.style.display = "none";
        btnText.textContent = "Save Profile";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!validateForm()) return;
      setLoading(true);

      const payload = {
        device_id: document.getElementById("device_id").value.trim(),
        full_name: document.getElementById("name").value.trim(),
        blood_group: document.getElementById("blood_group").value.trim() || "Not specified",
        allergies: document.getElementById("medical_conditions").value.trim() || "None reported"
      };

      try {
        const res = await fetch('/api/v1/register', {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (data.status === "SUCCESS") {
          localStorage.setItem("userProfile", JSON.stringify({
            ...payload,
            age: parseInt(document.getElementById("age").value),
            emergency_contact: document.getElementById("emergency_contact").value.trim()
          }));
          window.location.href = "/profile";
        } else {
          alert("Error saving profile: " + data.message);
        }
      } catch (err) {
        console.error("Backend request failed:", err);
        alert("Failed to reach server. Please try again.");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
