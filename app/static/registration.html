<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "🙈";
        } else {
            input.type = "password";
            btn.textContent = "👁️";
        }
    }

    function validatePhoneNumber(phoneInput) {
        const digitsOnly = phoneInput.replace(/\D/g, '');
        let coreDigits = digitsOnly;
        if (digitsOnly.length > 10) {
            coreDigits = digitsOnly.slice(-10);
        }
        return coreDigits.length === 10;
    }

    async function handleAuth(event) {
        event.preventDefault();
        const device_id = document.getElementById('authDeviceId').value.trim();
        const passcode = document.getElementById('authPasscode').value;

        try {
            const response = await fetch('/api/lookup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id, passcode })
            });

            if (response.ok) {
                const data = await response.json();
                
                document.getElementById('deviceId').value = device_id;
                document.getElementById('passcode').value = passcode;
                document.getElementById('fullName').value = data.name || '';
                document.getElementById('age').value = data.age || '';
                document.getElementById('bloodGroup').value = data.blood_group || '';
                document.getElementById('emergencyPhone').value = data.emergency_contact || '';
                document.getElementById('medicalConditions').value = data.medical_conditions || '';
                
                alert("Profile loaded successfully!");
            } else {
                const err = await response.json();
                alert("Authentication failed: " + (err.detail || "Invalid credentials"));
            }
        } catch (error) {
            alert("Error connecting to server.");
        }
    }

    async function handleSave(event) {
        event.preventDefault();

        const form = document.getElementById('profileForm');
        const phoneInput = document.getElementById('emergencyPhone').value;
        const phoneError = document.getElementById('phoneError');

        let isValid = true;

        if (!validatePhoneNumber(phoneInput)) {
            phoneError.style.display = 'block';
            isValid = false;
        } else {
            phoneError.style.display = 'none';
        }

        if (!form.checkValidity() || !isValid) {
            form.reportValidity();
            return;
        }

        // Keys changed to match main.py ProfileCreate schema ('name' & 'emergency_contact')
        const payload = {
            device_id: document.getElementById('deviceId').value.trim(),
            passcode: document.getElementById('passcode').value,
            name: document.getElementById('fullName').value.trim(),
            age: parseInt(document.getElementById('age').value, 10),
            blood_group: document.getElementById('bloodGroup').value.trim(),
            emergency_contact: document.getElementById('emergencyPhone').value.trim(),
            medical_conditions: document.getElementById('medicalConditions').value.trim() || "None listed"
        };

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Hardware Profile registered successfully!");
            } else {
                const err = await response.json();
                alert("Registration failed: " + (err.detail || "Unknown error"));
            }
        } catch (error) {
            alert("Network error: Could not save profile.");
        }
    }
</script>
