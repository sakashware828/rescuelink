<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RescueLink | Responder Operations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #0b0f19; color: #f8fafc; height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    .navbar-custom { background-color: #1e293b; border-bottom: 1px solid #334155; height: 60px; }
    .sidebar { width: 420px; background-color: #0f172a; border-right: 1px solid #334155; overflow-y: auto; height: calc(100vh - 60px); }
    .map-container { flex-grow: 1; height: calc(100vh - 60px); }
    .alert-card { background-color: #1e293b; border-left: 4px solid #ef4444; border-radius: 6px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-custom px-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <a href="/" class="text-decoration-none text-white fw-bold"><span class="badge bg-danger">RL</span> RESCUELINK</a>
      <span class="text-secondary small ms-2">Responder Operations</span>
    </div>
    <a href="/profile" class="btn btn-outline-light btn-sm">Switch to Device Linker</a>
  </nav>

  <div class="d-flex">
    <div class="sidebar p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="m-0 fw-bold text-uppercase text-secondary">Live Emergency Feed</h6>
        <span class="badge bg-danger" id="activeCount">0 Active</span>
      </div>
      <div id="feedList">
        <p class="text-secondary small text-center my-5" id="emptyState">No active emergency alerts recorded.</p>
      </div>
    </div>
    <div class="map-container" id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([19.0760, 72.8777], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

    let activeAlerts = 0;
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}/ws/alerts`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const emptyState = document.getElementById('emptyState');
      if (emptyState) emptyState.remove();

      activeAlerts++;
      document.getElementById('activeCount').innerText = `${activeAlerts} Active`;

      const card = document.createElement('div');
      card.className = 'alert-card p-3';
      card.innerHTML = `
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="badge bg-danger">${data.trigger_type}</span>
          <small class="text-secondary">Node: ${data.device_id}</small>
        </div>
        <h6 class="fw-bold mb-1">${data.name} (${data.age} yrs)</h6>
        <p class="small text-secondary mb-1"><strong>Blood:</strong> ${data.blood_group} | <strong>Contact:</strong> ${data.emergency_contact}</p>
        <p class="small text-warning mb-0"><strong>Medical Note:</strong> ${data.medical_conditions}</p>
      `;
      document.getElementById('feedList').prepend(card);

      const lat = parseFloat(data.latitude);
      const lng = parseFloat(data.longitude);
      const marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup(`<b>${data.name}</b><br>Trigger: ${data.trigger_type}`).openPopup();
      map.panTo([lat, lng]);
    };
  </script>
</body>
</html>
