<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RescueLink | Responder Operations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #0b0f19; color: #f8fafc; height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    .navbar-custom { background-color: #1e293b; border-bottom: 1px solid #334155; height: 60px; }
    .sidebar { width: 420px; background-color: #0f172a; border-right: 1px solid #334155; overflow-y: auto; height: calc(100vh - 60px); }
    .map-container { flex-grow: 1; height: calc(100vh - 60px); }
    .alert-card { background-color: #1e293b; border-left: 4px solid #ef4444; border-radius: 6px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-custom px-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <a href="/" class="text-decoration-none text-white fw-bold"><span class="badge bg-danger">RL</span> RESCUELINK</a>
      <span class="text-secondary small ms-2">Responder Operations Dashboard</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="badge bg-secondary" id="wsStatus">Disconnected</span>
      <a href="/profile" class="btn btn-outline-light btn-sm">Switch to Device Linker</a>
    </div>
  </nav>

  <div class="d-flex">
    <div class="sidebar p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="m-0 fw-bold text-uppercase text-secondary">Live Emergency Feed</h6>
        <span class="badge bg-danger" id="activeCount">0 Active</span>
      </div>
      <div id="feedList">
        <p class="text-secondary small text-center my-5" id="emptyState">No active emergency alerts recorded.</p>
      </div>
    </div>
    <div class="map-container" id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize Map with Mumbai default coordinates
    const map = L.map('map').setView([19.0760, 72.8777], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
      attribution: '&copy; OpenStreetMap' 
    }).addTo(map);

    // Fix map render sizing bugs on window resize/load
    setTimeout(() => { map.invalidateSize(); }, 300);

    let activeAlerts = 0;
    let ws;

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/alerts`;
      const statusBadge = document.getElementById('wsStatus');

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusBadge.className = 'badge bg-success';
        statusBadge.innerText = 'Live Feed Connected';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const emptyState = document.getElementById('emptyState');
          if (emptyState) emptyState.remove();

          activeAlerts++;
          document.getElementById('activeCount').innerText = `${activeAlerts} Active`;

          // Construct Feed Card
          const card = document.createElement('div');
          card.className = 'alert-card p-3';
          card.innerHTML = `
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge bg-danger">${data.trigger_type || 'EMERGENCY'}</span>
              <small class="text-secondary">Node: ${data.device_id || 'N/A'}</small>
            </div>
            <h6 class="fw-bold mb-1">${data.name || 'Unknown Subject'} (${data.age || 'N/A'} yrs)</h6>
            <p class="small text-secondary mb-1"><strong>Blood:</strong> ${data.blood_group || 'N/A'} | <strong>Contact:</strong> ${data.emergency_contact || 'N/A'}</p>
            <p class="small text-warning mb-0"><strong>Medical Note:</strong> ${data.medical_conditions || 'None'}</p>
          `;
          document.getElementById('feedList').prepend(card);

          // Update Map Marker & Center
          const lat = parseFloat(data.latitude);
          const lng = parseFloat(data.longitude);
          
          if (!isNaN(lat) && !isNaN(lng)) {
            const marker = L.marker([lat, lng]).addTo(map);
            marker.bindPopup(`<b>${data.name || 'Unknown'}</b><br>Trigger: ${data.trigger_type || 'Alert'}`).openPopup();
            map.setView([lat, lng], 14);
          }
        } catch (err) {
          console.error("Failed to parse incoming WS message:", err);
        }
      };

      ws.onclose = () => {
        statusBadge.className = 'badge bg-danger';
        statusBadge.innerText = 'Disconnected - Retrying...';
        // Auto-reconnect every 3 seconds if connection drops
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    // Start WebSocket Connection
    connectWebSocket();
  </script>
</body>
</html>
