<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink | Responder Operations Dashboard</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .navbar-custom {
      background-color: var(--panel-dark);
      border-bottom: 1px solid var(--border-dark);
      height: 62px;
      padding: 0 1.5rem;
    }

    .brand-logo {
      font-weight: 800;
      letter-spacing: 0.5px;
      font-size: 1.15rem;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-container {
      display: flex;
      height: calc(100vh - 62px);
      width: 100vw;
    }

    .sidebar {
      width: 440px;
      min-width: 360px;
      max-width: 480px;
      background-color: var(--panel-dark);
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border-dark);
      background-color: rgba(15, 23, 42, 0.95);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
    }

    .map-container {
      flex: 1;
      height: 100%;
      background-color: #1e293b;
      position: relative;
    }

    .alert-card {
      background-color: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-left: 4px solid var(--accent-red);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .alert-card:hover {
      border-color: #475569;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.3);
    }

    .alert-card.new-alert-pulse {
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .trigger-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .btn-center-map {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 5px;
      transition: all 0.15s;
    }
    .btn-center-map:hover {
      background-color: var(--accent-blue);
      color: #0f172a;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-connected { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-disconnected { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }

    /* Laptop / Responder Location Pulse Marker */
    .user-marker-container {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-marker-pulse {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: rgba(56, 189, 248, 0.4);
      animation: user-radar 2s infinite ease-out;
    }

    @keyframes user-radar {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .user-marker-dot {
      width: 22px;
      height: 22px;
      background-color: #0284c7;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: white;
    }

    /* Custom Leaflet Dark Marker Popup */
    .leaflet-popup-content-wrapper {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #475569;
      border-radius: 8px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip {
      background-color: #1e293b !important;
    }

    /* Floating Map Toolbar */
    .map-floating-toolbar {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 999;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .distance-tag {
      background-color: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      border-radius: 4px;
      font-size: 0.75rem;
      padding: 2px 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-custom d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <a href="/" class="brand-logo">
        <span class="badge bg-danger px-2 py-1 fs-6">RL</span>
        <span>RESCUELINK</span>
      </a>
      <span class="text-secondary d-none d-md-inline small border-start border-secondary ps-3">
        <i class="bi bi-broadcast text-danger me-1"></i> Responder Operations Dashboard
      </span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <!-- Live WebSocket Connection Badge -->
      <span class="badge bg-dark border border-secondary px-3 py-2 d-flex align-items-center text-white" id="wsStatusBadge">
        <span class="status-indicator status-disconnected" id="wsIndicator"></span>
        <span id="wsStatusText">Connecting...</span>
      </span>

      <!-- Laptop Live Location Button -->
      <button class="btn btn-sm btn-outline-info d-flex align-items-center gap-1" onclick="toggleUserLiveLocation()" id="btnUserLoc">
        <i class="bi bi-geo-alt-fill"></i>
        <span id="userLocText">Locate My Laptop</span>
      </button>

      <!-- Quick Trigger Simulation Button -->
      <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1" onclick="triggerTestAlert()" id="btnSimAlert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Simulate Alert</span>
      </button>

      <!-- Nav Links -->
      <a href="/profile" class="btn btn-sm btn-outline-light d-flex align-items-center gap-1">
        <i class="bi bi-person-badge"></i>
        <span class="d-none d-sm-inline">Profile</span>
      </a>
      <a href="/registration" class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1">
        <i class="bi bi-plus-circle"></i>
        <span class="d-none d-sm-inline">Register Node</span>
      </a>
    </div>
  </nav>

  <!-- Main View Container -->
  <div class="main-container">
    
    <!-- Left Live Feed Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header d-flex justify-content-between align-items-center">
        <div>
          <h6 class="m-0 fw-bold text-uppercase text-secondary small">Live Emergency Feed</h6>
          <span class="small text-muted" id="lastUpdated">Real-time Stream</span>
        </div>
        <span class="badge bg-danger rounded-pill px-3 py-2" id="activeCount">0 Alerts</span>
      </div>

      <div class="sidebar-content" id="feedList">
        <div class="text-center my-5 py-5 text-secondary" id="emptyState">
          <i class="bi bi-shield-check fs-1 text-secondary opacity-50 mb-3 d-block"></i>
          <p class="mb-1 fw-semibold">No emergency alerts active</p>
          <small class="text-muted">Incoming IoT node transmissions will appear here live.</small>
        </div>
      </div>
    </aside>

    <!-- Right Full Map View -->
    <main class="map-container" id="map">
      
      <!-- Floating Map Info & Quick Action Bar -->
      <div class="map-floating-toolbar">
        <div class="d-flex align-items-center gap-2">
          <span class="small text-secondary" id="laptopGpsStatus">
            <i class="bi bi-laptop me-1"></i>Laptop GPS: <strong>Standby</strong>
          </span>
        </div>
        <button class="btn btn-xs btn-outline-light py-1 px-2 small" onclick="centerOnUserLocation()" id="btnCenterUser" style="font-size: 0.75rem; display: none;">
          <i class="bi bi-crosshair me-1"></i>Center on Me
        </button>
        <button class="btn btn-xs btn-outline-warning py-1 px-2 small" onclick="broadcastMyLocationAsAlert()" id="btnBroadcastUser" style="font-size: 0.75rem; display: none;">
          <i class="bi bi-broadcast me-1"></i>SOS from My Location
        </button>
      </div>

    </main>
  </div>

  <!-- Leaflet & Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Map with default view
    const defaultCoords = [19.0760, 72.8777]; // Mumbai Coordinates
    const map = L.map('map', { zoomControl: true }).setView(defaultCoords, 13);

    // Dark-themed tiles from CartoDB Voyager
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 250);

    const markersMap = {};
    let alertCount = 0;
    let ws;

    // --- RESPONDER / LAPTOP LIVE GEOLOCATION STATE ---
    let userLocation = null; // { lat, lng, accuracy }
    let userMarker = null;
    let userAccuracyCircle = null;
    let watchId = null;
    let dispatchLine = null;

    // Custom Marker for Laptop / Responder Location
    function createUserLocationIcon() {
      return L.divIcon({
        className: 'custom-user-marker-wrapper',
        html: `
          <div class="user-marker-container">
            <div class="user-marker-pulse"></div>
            <div class="user-marker-dot">💻</div>
          </div>
        `,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    // Custom Icon Maker for Emergency Alerts
    function createEmergencyIcon(type) {
      return L.divIcon({
        className: 'custom-emergency-marker',
        html: `<div style="
          background-color: #ef4444;
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 3px solid #ffffff;
          box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-size: 14px;
          font-weight: bold;
        ">🚨</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    // Haversine Distance Calculation (km)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function formatDistance(distKm) {
      if (isNaN(distKm)) return '';
      if (distKm < 1) {
        return `${Math.round(distKm * 1000)} m away`;
      }
      return `${distKm.toFixed(2)} km away`;
    }

    // Update or Plot Laptop Location on Map
    function updateUserPositionOnMap(lat, lng, accuracy) {
      userLocation = { lat, lng, accuracy };

      const gpsStatus = document.getElementById('laptopGpsStatus');
      const btnCenter = document.getElementById('btnCenterUser');
      const btnBroadcast = document.getElementById('btnBroadcastUser');
      const navBtn = document.getElementById('btnUserLoc');
      const navText = document.getElementById('userLocText');

      gpsStatus.innerHTML = `<i class="bi bi-geo-alt-fill text-info me-1"></i>My Location: <strong class="text-white">${lat.toFixed(4)}, ${lng.toFixed(4)}</strong> <span class="badge bg-secondary ms-1">&plusmn;${Math.round(accuracy)}m</span>`;
      btnCenter.style.display = 'inline-block';
      btnBroadcast.style.display = 'inline-block';
      navBtn.className = 'btn btn-sm btn-info text-dark fw-bold d-flex align-items-center gap-1';
      navText.innerText = 'Live GPS Active';

      const popupContent = `
        <div style="font-size: 0.9rem; padding: 2px;">
          <div style="color: #38bdf8; font-weight: 700; text-transform: uppercase; margin-bottom: 4px;">
            💻 Responder Station (You)
          </div>
          <p class="small mb-1 text-light"><strong>Coordinates:</strong> ${lat.toFixed(6)}, ${lng.toFixed(6)}</p>
          <p class="small mb-1 text-secondary"><strong>Accuracy:</strong> &plusmn;${Math.round(accuracy)} meters</p>
          <small class="text-muted">Live Browser GPS tracking enabled</small>
        </div>
      `;

      if (!userMarker) {
        userMarker = L.marker([lat, lng], { icon: createUserLocationIcon(), zIndexOffset: 1000 }).addTo(map);
        userMarker.bindPopup(popupContent);

        userAccuracyCircle = L.circle([lat, lng], {
          radius: accuracy || 50,
          color: '#38bdf8',
          fillColor: '#38bdf8',
          fillOpacity: 0.12,
          weight: 1.5
        }).addTo(map);

        map.setView([lat, lng], 14);
      } else {
        userMarker.setLatLng([lat, lng]);
        userMarker.setPopupContent(popupContent);
        if (userAccuracyCircle) {
          userAccuracyCircle.setLatLng([lat, lng]);
          userAccuracyCircle.setRadius(accuracy || 50);
        }
      }

      // Update distance tags on all active cards
      updateAllCardDistances();
    }

    function centerOnUserLocation() {
      if (userLocation) {
        map.flyTo([userLocation.lat, userLocation.lng], 16, { animate: true });
        if (userMarker) userMarker.openPopup();
      }
    }

    // Toggle Laptop Live Geolocation Tracking
    function toggleUserLiveLocation() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your web browser.");
        return;
      }

      if (watchId !== null) {
        // Stop tracking
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById('laptopGpsStatus').innerHTML = '<i class="bi bi-laptop me-1"></i>Laptop GPS: <strong>Standby</strong>';
        document.getElementById('btnUserLoc').className = 'btn btn-sm btn-outline-info d-flex align-items-center gap-1';
        document.getElementById('userLocText').innerText = 'Locate My Laptop';
        document.getElementById('btnCenterUser').style.display = 'none';
        document.getElementById('btnBroadcastUser').style.display = 'none';
        if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
        if (userAccuracyCircle) { map.removeLayer(userAccuracyCircle); userAccuracyCircle = null; }
        if (dispatchLine) { map.removeLayer(dispatchLine); dispatchLine = null; }
        userLocation = null;
        return;
      }

      const navText = document.getElementById('userLocText');
      navText.innerText = 'Acquiring GPS...';

      // Request live position with high accuracy
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;
          updateUserPositionOnMap(lat, lng, accuracy);
        },
        (err) => {
          console.error("Geolocation error:", err);
          alert(`Could not acquire location: ${err.message}. Please allow location access in your browser.`);
          navText.innerText = 'Locate My Laptop';
          watchId = null;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 3000
        }
      );
    }

    // Update Distance Labels on Cards
    function updateAllCardDistances() {
      if (!userLocation) return;
      document.querySelectorAll('.alert-card').forEach(card => {
        const lat = parseFloat(card.dataset.lat);
        const lng = parseFloat(card.dataset.lng);
        if (!isNaN(lat) && !isNaN(lng)) {
          const distKm = calculateDistance(userLocation.lat, userLocation.lng, lat, lng);
          const distBadge = card.querySelector('.distance-tag-container');
          if (distBadge) {
            distBadge.innerHTML = `<span class="distance-tag"><i class="bi bi-pin-map-fill me-1"></i>${formatDistance(distKm)}</span>`;
          }
        }
      });
    }

    // Draw Line from Laptop Location to Incident
    function drawDispatchRoute(destLat, destLng, alertId) {
      if (!userLocation) {
        focusMarker(destLat, destLng, alertId);
        return;
      }

      if (dispatchLine) {
        map.removeLayer(dispatchLine);
      }

      const latlngs = [
        [userLocation.lat, userLocation.lng],
        [destLat, destLng]
      ];

      const dist = calculateDistance(userLocation.lat, userLocation.lng, destLat, destLng);

      dispatchLine = L.polyline(latlngs, {
        color: '#38bdf8',
        weight: 3,
        dashArray: '8, 8',
        opacity: 0.85
      }).addTo(map);

      // Fit bounds to show both user and incident
      const bounds = L.latLngBounds(latlngs);
      map.fitBounds(bounds, { padding: [60, 60] });

      if (markersMap[alertId]) {
        markersMap[alertId].openPopup();
      }
    }

    // Add or Update Card in Sidebar & Marker on Map
    function processAlert(data, isHistorical = false) {
      const emptyState = document.getElementById('emptyState');
      if (emptyState) emptyState.remove();

      alertCount++;
      document.getElementById('activeCount').innerText = `${alertCount} Alerts`;

      const alertId = data.id || `alert_${Date.now()}_${Math.random()}`;
      const lat = parseFloat(data.latitude) || 19.0760;
      const lng = parseFloat(data.longitude) || 72.8777;
      const trigger = data.trigger_type || data.status || 'EMERGENCY';
      const name = data.name || 'Unregistered Node';
      const age = data.age ? `${data.age} yrs` : 'N/A';
      const blood = data.blood_group || 'N/A';
      const phone = data.emergency_contact || 'N/A';
      const medical = data.medical_conditions || 'None listed';
      const timeStr = data.timestamp || new Date().toLocaleTimeString();

      let distStr = '';
      if (userLocation) {
        const distKm = calculateDistance(userLocation.lat, userLocation.lng, lat, lng);
        distStr = `<span class="distance-tag"><i class="bi bi-pin-map-fill me-1"></i>${formatDistance(distKm)}</span>`;
      }

      // Sidebar Card
      const card = document.createElement('div');
      card.className = `alert-card ${!isHistorical ? 'new-alert-pulse' : ''}`;
      card.id = `card_${alertId}`;
      card.dataset.lat = lat;
      card.dataset.lng = lng;

      card.innerHTML = `
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="badge bg-danger trigger-badge">${trigger}</span>
          <div class="d-flex align-items-center gap-2">
            <span class="distance-tag-container">${distStr}</span>
            <small class="text-secondary"><i class="bi bi-clock me-1"></i>${timeStr}</small>
          </div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-1">
          <h6 class="fw-bold text-white mb-0">${name} <span class="text-secondary fw-normal">(${age})</span></h6>
          <small class="text-info fw-semibold">ID: ${data.device_id || 'N/A'}</small>
        </div>

        <p class="small text-secondary mb-1">
          <strong class="text-light">Blood:</strong> <span class="badge bg-secondary">${blood}</span> &nbsp;|&nbsp;
          <strong class="text-light">Contact:</strong> <a href="tel:${phone}" class="text-info text-decoration-none">${phone}</a>
        </p>

        ${data.govt_id_number ? `
          <p class="small text-secondary mb-1">
            <strong>${data.govt_id_type || 'Govt ID'}:</strong> ${data.govt_id_number}
          </p>
        ` : ''}

        <p class="small text-warning mb-2">
          <i class="bi bi-heart-pulse-fill me-1"></i><strong>Medical Notes:</strong> ${medical}
        </p>

        ${data.message ? `<p class="small text-muted mb-2 fst-italic">"${data.message}"</p>` : ''}

        <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary border-opacity-25">
          <small class="text-muted font-monospace"><i class="bi bi-geo-alt me-1"></i>${lat.toFixed(4)}, ${lng.toFixed(4)}</small>
          <div class="d-flex gap-1">
            <button class="btn btn-center-map" onclick="drawDispatchRoute(${lat}, ${lng}, '${alertId}')" title="Draw direct dispatch vector">
              <i class="bi bi-cursor me-1"></i> Dispatch Route
            </button>
          </div>
        </div>
      `;

      const feedList = document.getElementById('feedList');
      if (isHistorical) {
        feedList.appendChild(card);
      } else {
        feedList.prepend(card);
      }

      // Map Marker
      if (!isNaN(lat) && !isNaN(lng)) {
        const marker = L.marker([lat, lng], { icon: createEmergencyIcon(trigger) }).addTo(map);
        
        const popupContent = `
          <div style="font-size: 0.9rem; padding: 2px;">
            <div style="color: #ef4444; font-weight: 700; text-transform: uppercase; margin-bottom: 4px;">
              🚨 ${trigger}
            </div>
            <h6 style="margin: 0 0 6px 0; color: #ffffff; font-weight: bold;">${name} (${age})</h6>
            <div style="font-size: 0.82rem; color: #cbd5e1; margin-bottom: 4px;">
              <strong>Node ID:</strong> ${data.device_id || 'N/A'}<br>
              <strong>Blood:</strong> ${blood}<br>
              <strong>Emergency Phone:</strong> <a href="tel:${phone}" style="color: #38bdf8;">${phone}</a><br>
              <strong>Medical:</strong> <span style="color: #facc15;">${medical}</span>
            </div>
            <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 6px;">
              Time: ${timeStr}
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersMap[alertId] = marker;

        if (!isHistorical) {
          marker.openPopup();
          if (userLocation) {
            drawDispatchRoute(lat, lng, alertId);
          } else {
            map.flyTo([lat, lng], 15, { animate: true, duration: 1 });
          }
        }
      }
    }

    function focusMarker(lat, lng, alertId) {
      map.flyTo([lat, lng], 16, { animate: true, duration: 0.8 });
      if (markersMap[alertId]) {
        markersMap[alertId].openPopup();
      }
    }

    // Broadcast Laptop's Exact Location as an Emergency Incident (Test Mode)
    async function broadcastMyLocationAsAlert() {
      if (!userLocation) {
        alert("Please enable live laptop location first.");
        return;
      }

      const payload = {
        device_id: "LAPTOP_STATION_01",
        trigger_type: "SOS_MANUAL_RESPONDER",
        latitude: userLocation.lat,
        longitude: userLocation.lng,
        speed: 0.0,
        battery: 100,
        message: "Responder laptop dispatched live distress SOS with real GPS coordinates."
      };

      try {
        const res = await fetch('/api/alerts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          console.log("Transmitted laptop live SOS.");
        }
      } catch (err) {
        alert("Could not transmit alert.");
      }
    }

    // Fetch Existing Historical Alerts
    async function loadRecentAlerts() {
      try {
        const res = await fetch('/api/alerts?limit=25');
        if (res.ok) {
          const data = await res.json();
          if (data.alerts && data.alerts.length > 0) {
            data.alerts.slice().reverse().forEach(alert => processAlert(alert, true));
            const latest = data.alerts[0];
            if (latest.latitude && latest.longitude && !userLocation) {
              map.setView([latest.latitude, latest.longitude], 14);
            }
          }
        }
      } catch (err) {
        console.warn("Could not prefetch recent alerts:", err);
      }
    }

    // Connect WebSocket
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/alerts`;
      const badge = document.getElementById('wsStatusBadge');
      const indicator = document.getElementById('wsIndicator');
      const text = document.getElementById('wsStatusText');

      indicator.className = 'status-indicator status-disconnected';
      text.innerText = 'Connecting...';

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        indicator.className = 'status-indicator status-connected';
        text.innerText = 'Live Feed Connected';
      };

      ws.onmessage = (event) => {
        try {
          const alertData = JSON.parse(event.data);
          processAlert(alertData, false);
        } catch (err) {
          console.error("Failed to parse WebSocket message:", err);
        }
      };

      ws.onclose = () => {
        indicator.className = 'status-indicator status-disconnected';
        text.innerText = 'Disconnected (Retrying)';
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    // Trigger Test Alert via HTTP
    async function triggerTestAlert() {
      const btn = document.getElementById('btnSimAlert');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Triggering...';

      try {
        const res = await fetch('/api/test-alert', { method: 'POST' });
        if (!res.ok) {
          alert("Failed to simulate alert.");
        }
      } catch (e) {
        alert("Error sending test alert request.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> <span>Simulate Alert</span>';
      }
    }

    // Prompt user for laptop location on dashboard load automatically or via button
    function initUserLocationPrompt() {
      if (navigator.geolocation) {
        // Auto-request initial location
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            updateUserPositionOnMap(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
            // Start continuous watch
            toggleUserLiveLocation();
          },
          (err) => {
            console.log("Auto-location permission prompt skipped/denied. Click 'Locate My Laptop' anytime.");
          },
          { enableHighAccuracy: true, timeout: 6000 }
        );
      }
    }

    // Initialize Dashboard
    loadRecentAlerts();
    connectWebSocket();
    initUserLocationPrompt();
  </script>
</body>
</html>
