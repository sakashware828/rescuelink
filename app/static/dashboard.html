<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink — Responder Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Responder Authentication Gate Modal -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/90 z-[9999] flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-md w-full shadow-2xl">
      <div class="flex items-center space-x-3 mb-4 border-b border-slate-700 pb-3">
        <div class="bg-red-600 p-2 rounded-lg text-white font-black text-sm">RL</div>
        <h2 class="text-lg font-bold text-white">Responder Authentication</h2>
      </div>
      <p class="text-xs text-slate-400 mb-4">Authorized emergency response team access only.</p>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
          <input type="text" id="username" value="admin" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-red-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
          <input type="password" id="password" value="rescue123" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-red-500">
        </div>
        <div id="loginError" class="text-red-500 text-xs hidden">Invalid responder credentials. Access denied.</div>
        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded text-sm transition">Authenticate</button>
      </form>
    </div>
  </div>

  <!-- Navigation Header -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-red-600 p-2 rounded-lg text-white font-black text-sm tracking-wider">RL</div>
      <span class="font-bold text-xl tracking-wide text-red-500 uppercase">RescueLink <span class="text-xs text-slate-400 lowercase font-normal">Dashboard</span></span>
    </div>
    <div class="flex space-x-4 text-sm font-semibold">
      <a href="/dashboard" class="text-red-400 border-b-2 border-red-500 pb-0.5">Dashboard</a>
      <a href="/registration" class="text-slate-400 hover:text-white transition">Registration</a>
      <a href="/profile" class="text-slate-400 hover:text-white transition">Profile</a>
      <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400 border border-slate-700 rounded px-2 py-0.5">Logout</button>
    </div>
  </nav>

  <!-- Dashboard Grid View -->
  <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4 p-4">
    
    <!-- Real-Time Feed Panel -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 flex flex-col h-[calc(100vh-100px)]">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-3">
        <h3 class="font-bold text-slate-200 text-sm tracking-wide">Live Emergency Feed</h3>
        <span id="alertCount" class="bg-red-600/20 text-red-400 text-xs px-2 py-0.5 rounded-full font-bold">0 Active</span>
      </div>

      <div id="alertsFeed" class="flex-1 overflow-y-auto space-y-3 pr-1">
        <div id="noAlertsMessage" class="text-slate-500 text-center text-xs py-8">Waiting for real-time telemetry inputs...</div>
      </div>
    </div>

    <!-- Map View -->
    <div class="lg:col-span-2 bg-slate-800/90 border border-slate-700 rounded-xl overflow-hidden h-[calc(100vh-100px)] relative">
      <div id="map" class="w-full h-full"></div>
    </div>
  </div>

  <script>
    // Server-Side Verification Auth Flow
    function checkAuth() {
      if (sessionStorage.getItem("authenticated") === "true") {
        document.getElementById("loginModal").classList.add("hidden");
        loadRealTimeData();
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const params = new URLSearchParams();
      params.append("username", document.getElementById("username").value.trim());
      params.append("password", document.getElementById("password").value.trim());

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params
        });

        if (res.ok) {
          sessionStorage.setItem("authenticated", "true");
          document.getElementById("loginModal").classList.add("hidden");
          document.getElementById("loginError").classList.add("hidden");
          loadRealTimeData();
        } else {
          document.getElementById("loginError").classList.remove("hidden");
        }
      } catch (err) {
        console.error("Auth server error:", err);
        document.getElementById("loginError").classList.remove("hidden");
      }
    });

    function logout() {
      sessionStorage.removeItem("authenticated");
      location.reload();
    }

    // Leaflet Map Setup
    const map = L.map('map').setView([19.0760, 72.8777], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let alertsStore = [];
    const markers = {};

    // Priority Sort Algorithm: Manual triggers first, then newest timestamp
    function sortAlerts(alerts) {
      return alerts.sort((a, b) => {
        if (a.trigger_type === 'manual' && b.trigger_type !== 'manual') return -1;
        if (a.trigger_type !== 'manual' && b.trigger_type === 'manual') return 1;
        const timeA = new Date(a.received_at || Date.now()).getTime();
        const timeB = new Date(b.received_at || Date.now()).getTime();
        return timeB - timeA;
      });
    }

    function renderFeed() {
      const feed = document.getElementById("alertsFeed");
      feed.innerHTML = "";

      if (alertsStore.length === 0) {
        feed.innerHTML = '<div class="text-slate-500 text-center text-xs py-8">No active emergency alerts recorded.</div>';
        document.getElementById("alertCount").textContent = "0 Active";
        return;
      }
      
      const sorted = sortAlerts([...alertsStore]);
      document.getElementById("alertCount").textContent = `${sorted.length} Active`;

      sorted.forEach(alert => {
        const isManual = alert.trigger_type === 'manual';
        const card = document.createElement("div");
        card.className = `p-3 rounded-lg border transition cursor-pointer ${
          isManual 
            ? 'bg-red-950/40 border-red-600/60 hover:border-red-500' 
            : 'bg-amber-950/30 border-amber-600/40 hover:border-amber-500'
        }`;

        card.onclick = () => {
          if (alert.latitude && alert.longitude) {
            map.setView([parseFloat(alert.latitude), parseFloat(alert.longitude)], 15);
          }
        };

        card.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-sm ${isManual ? 'text-red-400' : 'text-amber-400'}">
              ${isManual ? '🚨 MANUAL SOS' : '⚠️ AUTO FALL DETECTED'}
            </span>
            <span class="text-[10px] text-slate-400 bg-slate-900/60 px-1.5 py-0.5 rounded">${alert.device_id}</span>
          </div>
          <div class="text-xs text-slate-200 font-semibold">${alert.name || alert.victim_name || 'Registered Node User'}</div>
          <div class="text-[11px] text-slate-400 mt-1">
            Blood: <span class="text-slate-200">${alert.blood_group || 'N/A'}</span> | Contact: ${alert.emergency_contact || 'N/A'}
          </div>
          <div class="text-[11px] text-slate-400">
            Medical Notes: <span class="text-slate-300">${alert.medical_conditions || alert.critical_allergies || 'None'}</span>
          </div>
          <div class="text-[10px] text-slate-500 mt-1">
            Coords: ${alert.latitude || '0'}, ${alert.longitude || '0'}
          </div>
        `;

        feed.appendChild(card);

        // Render Leaflet Map Markers
        if (alert.latitude && alert.longitude && !markers[alert.device_id]) {
          const marker = L.marker([parseFloat(alert.latitude), parseFloat(alert.longitude)])
            .addTo(map)
            .bindPopup(`<b>Node: ${alert.device_id}</b><br>User: ${alert.name || alert.victim_name || 'Unknown'}<br>${isManual ? 'Manual SOS' : 'Auto Fall'}`);
          markers[alert.device_id] = marker;
        }
      });
    }

    // Load DB dynamic data
    async function loadRealTimeData() {
      try {
        const res = await fetch('/api/alerts');
        if (res.ok) {
          alertsStore = await res.json();
          renderFeed();
        }
      } catch (e) {
        console.log("Listening for incoming WebSocket events.");
      }
    }

    // WebSocket Stream
    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${wsScheme}://${window.location.host}/ws/alerts`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      alertsStore = alertsStore.filter(a => a.device_id !== data.device_id);
      alertsStore.unshift(data);
      renderFeed();
    };

    checkAuth();
  </script>
</body>
</html>
