<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink — Responder Dashboard</title>
  
  <!-- Tailwind CSS & Leaflet CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <style>
    /* Custom Pulsing Markers for Map */
    .pulse-marker-sos {
      background: #dc2626;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(220, 38, 38, 0.7);
      animation: pulse-red 1.5s infinite;
    }

    .pulse-marker-fall {
      background: #ea580c;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(234, 88, 12, 0.7);
      animation: pulse-orange 1.5s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }

    @keyframes pulse-orange {
      0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(234, 88, 12, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Top Navigation Header -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center z-50 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-red-600 p-2 rounded-lg text-white font-black text-sm tracking-wider">RL</div>
      <span class="font-bold text-xl tracking-wide text-red-500 uppercase">RescueLink <span class="text-xs text-slate-400 lowercase font-normal">Command Center</span></span>
    </div>

    <!-- Live Stats Bar -->
    <div class="hidden md:flex space-x-6 text-xs font-semibold">
      <div class="bg-slate-900 px-3 py-1.5 rounded-md border border-slate-700">
        <span class="text-slate-400">Total Alerts:</span> <span id="statTotal" class="text-white ml-1">0</span>
      </div>
      <div class="bg-slate-900 px-3 py-1.5 rounded-md border border-slate-700">
        <span class="text-slate-400">SOS Triggers:</span> <span id="statSos" class="text-red-400 ml-1">0</span>
      </div>
      <div class="bg-slate-900 px-3 py-1.5 rounded-md border border-slate-700">
        <span class="text-slate-400">Falls Detected:</span> <span id="statFall" class="text-orange-400 ml-1">0</span>
      </div>
    </div>

    <!-- Links -->
    <div class="flex space-x-4 text-sm font-semibold">
      <a href="/dashboard" class="text-red-400 border-b-2 border-red-500 pb-0.5">Dashboard</a>
      <a href="/registration" class="text-slate-400 hover:text-white transition">Registration</a>
      <a href="/profile" class="text-slate-400 hover:text-white transition">Profile</a>
    </div>
  </nav>

  <!-- Dashboard Layout -->
  <div class="flex flex-1 h-[calc(100vh-57px)]">
    
    <!-- Sidebar -->
    <div class="w-96 bg-slate-800/90 border-r border-slate-700 flex flex-col p-4 z-10">
      <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center">
          <span id="connStatus" class="inline-block w-3 h-3 rounded-full bg-slate-500 mr-2 shadow"></span>
          Telemetry Stream
        </h2>
        <span id="connLabel" class="text-xs text-slate-400">Connecting...</span>
      </div>

      <!-- Alert Cards Feed -->
      <div id="alertList" class="flex-1 overflow-y-auto space-y-3 pr-1">
        <div class="text-center text-slate-500 py-10 text-sm italic">Waiting for incoming telemetry stream...</div>
      </div>
    </div>

    <!-- Map View -->
    <div id="map" class="flex-1 h-full bg-slate-950"></div>
  </div>

  <script>
    const map = L.map('map').setView([19.0760, 72.8777], 12);
    
    // Dark Theme Leaflet Map Tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    const alertsList = [];
    const markers = {};
    const alertListEl = document.getElementById("alertList");
    const connStatusEl = document.getElementById("connStatus");
    const connLabelEl = document.getElementById("connLabel");

    let socket;

    function connectWebSocket() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${window.location.host}/ws/alerts`;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        connStatusEl.className = "inline-block w-3 h-3 rounded-full bg-emerald-500 mr-2 shadow-sm shadow-emerald-500";
        connLabelEl.textContent = "Live Stream Active";
        connLabelEl.className = "text-xs text-emerald-400";
        if (alertsList.length === 0) {
          alertListEl.innerHTML = `<div class="text-center text-slate-400 py-10 text-sm">Connected. Waiting for live telemetry signals...</div>`;
        }
      };

      socket.onclose = () => {
        connStatusEl.className = "inline-block w-3 h-3 rounded-full bg-red-500 mr-2 shadow-sm shadow-red-500";
        connLabelEl.textContent = "Reconnecting...";
        connLabelEl.className = "text-xs text-red-400";
        setTimeout(connectWebSocket, 3000); // Auto-reconnect after 3 seconds
      };

      socket.onerror = (err) => {
        console.error("WebSocket Error:", err);
      };

      socket.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          payload.received_at = new Date().toISOString();
          
          alertsList.unshift(payload);
          updateStats();
          renderList();
          addMarker(payload);
        } catch (e) {
          console.error("Error parsing WebSocket payload:", e);
        }
      };
    }

    function updateStats() {
      document.getElementById("statTotal").textContent = alertsList.length;
      document.getElementById("statSos").textContent = alertsList.filter(a => a.sos_triggered).length;
      document.getElementById("statFall").textContent = alertsList.filter(a => !a.sos_triggered).length;
    }

    function renderList() {
      if (alertsList.length === 0) {
        alertListEl.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm">No active alerts.</div>`;
        return;
      }

      alertListEl.innerHTML = alertsList.map((a, idx) => {
        const isSos = a.sos_triggered;
        const borderClass = isSos ? "border-l-4 border-l-red-500 bg-slate-800" : "border-l-4 border-l-orange-500 bg-slate-800";
        const badgeBg = isSos ? "bg-red-500/20 text-red-400 border border-red-500/30" : "bg-orange-500/20 text-orange-400 border border-orange-500/30";
        const triggerLabel = isSos ? "Manual SOS Triggered" : "Fall Detected";

        return `
          <div class="alert-card ${borderClass} p-3.5 rounded-r-lg shadow-md hover:bg-slate-750 transition cursor-pointer border-y border-r border-slate-700/60" onclick="focusMarker(${a.latitude}, ${a.longitude})">
            <div class="flex justify-between items-start mb-1">
              <span class="font-bold text-slate-100 text-sm">${a.victim_name || "Unknown Victim"}</span>
              <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${badgeBg}">${triggerLabel}</span>
            </div>
            <div class="text-xs text-slate-400 space-y-0.5 mt-2">
              <div><strong class="text-slate-300">Device ID:</strong> ${a.device_id}</div>
              <div><strong class="text-slate-300">Blood Group:</strong> <span class="text-slate-200 font-semibold">${a.blood_group || "Unknown"}</span></div>
              <div><strong class="text-slate-300">Notes/Allergies:</strong> ${a.critical_allergies || "None"}</div>
              <div class="text-[11px] text-slate-500 mt-2 text-right">${new Date(a.received_at).toLocaleTimeString()}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function addMarker(a) {
      const markerKey = `${a.device_id}-${a.latitude}-${a.longitude}`;
      const isSos = a.sos_triggered;
      
      const customIcon = L.divIcon({
        className: isSos ? 'pulse-marker-sos' : 'pulse-marker-fall',
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      const triggerLabel = isSos ? "Manual SOS" : "Fall Detected";
      const marker = L.marker([a.latitude, a.longitude], { icon: customIcon }).addTo(map)
        .bindPopup(`
          <div class="text-slate-900 font-sans p-1">
            <h3 class="font-bold text-base border-b border-slate-200 pb-1 mb-1">${a.victim_name || "Unknown Victim"}</h3>
            <p class="text-xs"><b>Alert:</b> ${triggerLabel}</p>
            <p class="text-xs"><b>Blood Group:</b> ${a.blood_group || "N/A"}</p>
            <p class="text-xs"><b>Device:</b> ${a.device_id}</p>
            <p class="text-xs text-slate-500 mt-1">${new Date(a.received_at).toLocaleTimeString()}</p>
          </div>
        `);

      markers[markerKey] = marker;
      map.setView([a.latitude, a.longitude], 14, { animate: true });
      marker.openPopup();
    }

    function focusMarker(lat, lng) {
      map.setView([lat, lng], 16, { animate: true });
    }

    // Start WebSocket
    connectWebSocket();
  </script>
</body>
</html>
