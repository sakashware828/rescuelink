<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink — Registered Profile</title>
  <style>
    :root {
      --primary: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 24px;
    }

    /* Navigation Header */
    .nav-bar {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .nav-brand {
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1.2px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      background-color: #dcfce7;
      color: #15803d;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .device-id {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      font-family: monospace;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      margin-bottom: 20px;
    }

    .info-item label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info-item span {
      font-size: 15px;
      font-weight: 600;
    }

    .full-width {
      grid-column: span 2;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #475569;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <nav class="nav-bar">
    <span class="nav-brand">RescueLink System</span>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/registration">Registration</a>
      <a href="/profile" class="active">Profile</a>
    </div>
  </nav>

  <div class="card">
    <span class="badge">✓ Active Device Registered</span>
    <h2 id="profName">---</h2>
    <div class="device-id">ID: <span id="profDeviceId">---</span></div>

    <div class="info-grid">
      <div class="info-item">
        <label>Age</label>
        <span id="profAge">---</span>
      </div>

      <div class="info-item">
        <label>Blood Group</label>
        <span id="profBlood">---</span>
      </div>

      <div class="info-item full-width">
        <label>Emergency Contact</label>
        <span id="profContact">---</span>
      </div>

      <div class="info-item full-width">
        <label>Medical Conditions / Allergies</label>
        <span id="profConditions">---</span>
      </div>
    </div>

    <div class="actions">
      <a href="/registration" class="btn btn-secondary">Edit Profile</a>
      <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
    </div>
  </div>

  <script>
    // Fetch profile data saved from registration
    const data = localStorage.getItem("userProfile");

    if (data) {
      const profile = JSON.parse(data);
      document.getElementById("profName").textContent = profile.full_name || profile.name || "N/A";
      document.getElementById("profDeviceId").textContent = profile.device_id || "N/A";
      document.getElementById("profAge").textContent = profile.age || "N/A";
      document.getElementById("profBlood").textContent = profile.blood_group || "N/A";
      document.getElementById("profContact").textContent = profile.emergency_contact || "N/A";
      document.getElementById("profConditions").textContent = profile.allergies || profile.medical_conditions || "None reported";
    } else {
      alert("No registered profile found. Please register your device first.");
      window.location.href = "/registration";
    }
  </script>
</body>
</html>
