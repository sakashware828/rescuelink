<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0b1329;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .top-nav {
      text-align: center;
      padding-top: 1.5rem;
      padding-bottom: 1rem;
    }
    .top-nav a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 8px;
    }
    .top-nav a:hover {
      text-decoration: underline;
    }
    .card-custom {
      background-color: #162036;
      border: 1px solid #1e2d4a;
      border-radius: 8px;
    }
    .card-title-custom {
      color: #ffffff;
      font-weight: 700;
    }
    .form-label {
      color: #f8fafc;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .text-danger-star {
      color: #ef4444;
    }
    .form-control, .form-select {
      background-color: #0d1627;
      border: 1px solid #1e2d4a;
      color: #ffffff;
    }
    .form-control::placeholder {
      color: #475569;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0d1627;
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: none;
    }
    .btn-submit {
      background-color: #ef4444;
      border: none;
      color: white;
      font-weight: 600;
    }
    .btn-submit:hover {
      background-color: #dc2626;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Top Title & Simple Navigation Bar -->
  <div class="top-nav">
    <h2 class="fw-bold mb-1">RescueLink Registration</h2>
    <div>
      <a href="/dashboard">Dashboard</a> | 
      <a href="/register">Registration</a> | 
      <a href="/profile">Profile</a>
    </div>
  </div>

  <div class="container pb-5" style="max-width: 650px;">
    
    <!-- Dynamic Alert Box -->
    <div id="statusAlert" class="alert d-none mb-4" role="alert"></div>

    <!-- Section 1: Authentication Form -->
    <div class="card card-custom p-4 mb-4">
      <h4 class="card-title-custom mb-3">Already registered? Load your profile</h4>
      <form id="authForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Device ID <span class="text-danger-star">*</span></label>
          <input type="text" id="authDeviceId" class="form-control" placeholder="001" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Passcode <span class="text-danger-star">*</span></label>
          <input type="password" id="authPasscode" class="form-control" placeholder="Passcode" required>
        </div>
        <div class="col-12 mt-4">
          <button type="submit" id="authBtn" class="btn btn-submit w-100 py-2 fs-5">Authenticate & Fetch Data</button>
        </div>
      </form>
    </div>

    <!-- Section 2: Registration / Edit Form -->
    <div class="card card-custom p-4">
      <h4 class="card-title-custom mb-3">📝 Register Hardware Node Profile</h4>
      <form id="profileForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Device ID <span class="text-danger-star">*</span></label>
          <input type="text" id="deviceId" class="form-control" placeholder="001" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Set Passcode <span class="text-danger-star">*</span></label>
          <input type="password" id="passcode" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Full Name <span class="text-danger-star">*</span></label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Age <span class="text-danger-star">*</span></label>
          <input type="number" id="age" class="form-control" min="0" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Blood Group <span class="text-danger-star">*</span></label>
          <select id="bloodGroup" class="form-select" required>
            <option value="" selected disabled>Select</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Emergency Contact Phone <span class="text-danger-star">*</span></label>
          <input type="text" id="emergencyContact" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Govt ID Type</label>
          <select id="govtIdType" class="form-select">
            <option value="Aadhaar">Aadhaar</option>
            <option value="Passport">Passport</option>
            <option value="Driver License">Driver License</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Govt ID Number</label>
          <input type="text" id="govtIdNumber" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Medical Conditions / Allergies</label>
          <textarea id="medicalConditions" class="form-control" rows="2" placeholder="None listed"></textarea>
        </div>
        <div class="col-12 mt-4">
          <button type="submit" id="saveBtn" class="btn btn-submit w-100 py-2 fs-5">Save Hardware Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function showAlert(message, type = 'danger') {
      const alertEl = document.getElementById('statusAlert');
      alertEl.className = `alert alert-${type} mb-4`;
      alertEl.textContent = message;
      alertEl.classList.remove('d-none');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const authBtn = document.getElementById('authBtn');
      authBtn.disabled = true;

      try {
        const res = await fetch('/api/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            device_id: document.getElementById('authDeviceId').value,
            passcode: document.getElementById('authPasscode').value
          })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          document.getElementById('deviceId').value = data.device_id || document.getElementById('authDeviceId').value;
          document.getElementById('passcode').value = document.getElementById('authPasscode').value;
          document.getElementById('name').value = data.name || '';
          document.getElementById('age').value = data.age || '';
          document.getElementById('bloodGroup').value = data.blood_group || '';
          document.getElementById('emergencyContact').value = data.emergency_contact || '';
          document.getElementById('govtIdType').value = data.govt_id_type || 'Aadhaar';
          document.getElementById('govtIdNumber').value = data.govt_id_number || '';
          document.getElementById('medicalConditions').value = data.medical_conditions || '';
          showAlert('Profile details fetched successfully!', 'success');
        } else {
          showAlert(data.detail || data.message || 'Authentication failed: Check Device ID or Passcode');
        }
      } catch (err) {
        showAlert('Network error reaching backend server.');
      } finally {
        authBtn.disabled = false;
      }
    });

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;

      const payload = {
        device_id: document.getElementById('deviceId').value,
        passcode: document.getElementById('passcode').value,
        name: document.getElementById('name').value,
        age: parseInt(document.getElementById('age').value, 10),
        blood_group: document.getElementById('bloodGroup').value,
        emergency_contact: document.getElementById('emergencyContact').value,
        govt_id_type: document.getElementById('govtIdType').value,
        govt_id_number: document.getElementById('govtIdNumber').value,
        medical_conditions: document.getElementById('medicalConditions').value || "None listed"
      };

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Hardware Node Profile Saved!', 'success');
        } else {
          showAlert(data.detail || data.message || 'Failed to save profile.');
        }
      } catch (err) {
        showAlert('Network error saving profile.');
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
