<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink | Device Linker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .navbar-custom { background-color: #1e293b; border-bottom: 1px solid #334155; height: 60px; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; }
    .form-control, .form-select { background-color: #0f172a; border: 1px solid #334155; color: #fff; }
    .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #ef4444; box-shadow: none; }
  </style>
</head>
<body>
  <nav class="navbar navbar-custom px-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <a href="/" class="text-decoration-none text-white fw-bold"><span class="badge bg-danger">RL</span> RESCUELINK</a>
      <span class="text-secondary small ms-2">Hardware Device Linker</span>
    </div>
    <a href="/dashboard" class="btn btn-outline-danger btn-sm">Switch to Responder Dashboard</a>
  </nav>

  <div class="container py-4" style="max-width: 650px;">
    <!-- Status Feedback Alert -->
    <div id="statusAlert" class="alert d-none mb-4" role="alert"></div>

    <!-- Lookup Form -->
    <div class="card card-custom p-4 mb-4">
      <h5 class="fw-bold mb-3">🔒 Authenticate Hardware Profile</h5>
      <form id="authForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label text-secondary small">Device ID</label>
          <input type="text" id="authDeviceId" class="form-control" placeholder="001" required>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small">Passcode</label>
          <input type="password" id="authPasscode" class="form-control" placeholder="Passcode" required>
        </div>
        <div class="col-12">
          <button type="submit" id="authBtn" class="btn btn-danger w-100 fw-bold">Authenticate & Fetch Data</button>
        </div>
      </form>
    </div>

    <!-- Registration & Editing Form -->
    <div class="card card-custom p-4 mb-5">
      <h5 class="fw-bold mb-3">📝 Profile Metadata Details</h5>
      <form id="profileForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label text-secondary small">Device ID</label>
          <input type="text" id="deviceId" class="form-control" placeholder="001" required>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small">Set Passcode</label>
          <input type="password" id="passcode" class="form-control" required>
        </div>
        <div class="col-md-8">
          <label class="form-label text-secondary small">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label text-secondary small">Age</label>
          <input type="number" id="age" class="form-control" min="0" required>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small">Blood Group</label>
          <input type="text" id="bloodGroup" class="form-control" placeholder="e.g. B+" required>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small">Emergency Contact Phone</label>
          <input type="text" id="emergencyContact" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small">Govt ID Type</label>
          <select id="govtIdType" class="form-select">
            <option value="Aadhaar">Aadhaar</option>
            <option value="Passport">Passport</option>
            <option value="Driver License">Driver License</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary small">Govt ID Number</label>
          <input type="text" id="govtIdNumber" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label text-secondary small">Medical Conditions / Allergies</label>
          <textarea id="medicalConditions" class="form-control" rows="2" placeholder="None listed"></textarea>
        </div>
        <div class="col-12 mt-4">
          <button type="submit" id="saveBtn" class="btn btn-success w-100 fw-bold">Save Hardware Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function showAlert(message, type = 'danger') {
      const alertEl = document.getElementById('statusAlert');
      alertEl.className = `alert alert-${type} mb-4`;
      alertEl.textContent = message;
      alertEl.classList.remove('d-none');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const authBtn = document.getElementById('authBtn');
      authBtn.disabled = true;

      try {
        const res = await fetch('/api/lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            device_id: document.getElementById('authDeviceId').value,
            passcode: document.getElementById('authPasscode').value
          })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          document.getElementById('deviceId').value = data.device_id || document.getElementById('authDeviceId').value;
          document.getElementById('passcode').value = document.getElementById('authPasscode').value;
          document.getElementById('name').value = data.name || '';
          document.getElementById('age').value = data.age || '';
          document.getElementById('bloodGroup').value = data.blood_group || '';
          document.getElementById('emergencyContact').value = data.emergency_contact || '';
          document.getElementById('govtIdType').value = data.govt_id_type || 'Aadhaar';
          document.getElementById('govtIdNumber').value = data.govt_id_number || '';
          document.getElementById('medicalConditions').value = data.medical_conditions || '';
          showAlert('Profile details fetched successfully!', 'success');
        } else {
          showAlert(data.detail || data.message || 'Authentication failed: Check Device ID or Passcode');
        }
      } catch (err) {
        showAlert('Network error reaching backend server.');
      } finally {
        authBtn.disabled = false;
      }
    });

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;

      const payload = {
        device_id: document.getElementById('deviceId').value,
        passcode: document.getElementById('passcode').value,
        name: document.getElementById('name').value,
        age: parseInt(document.getElementById('age').value, 10),
        blood_group: document.getElementById('bloodGroup').value,
        emergency_contact: document.getElementById('emergencyContact').value,
        govt_id_type: document.getElementById('govtIdType').value,
        govt_id_number: document.getElementById('govtIdNumber').value,
        medical_conditions: document.getElementById('medicalConditions').value || "None listed"
      };

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Hardware Node Profile Saved!', 'success');
        } else {
          showAlert(data.detail || data.message || 'Failed to save profile.');
        }
      } catch (err) {
        showAlert('Network error saving profile.');
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
