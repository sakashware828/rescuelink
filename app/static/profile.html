<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescueLink — Node Profile Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Navigation Header -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-red-600 p-2 rounded-lg text-white font-black text-sm tracking-wider">RL</div>
      <span class="font-bold text-xl tracking-wide text-red-500 uppercase">RescueLink <span class="text-xs text-slate-400 lowercase font-normal">Profile Lookup</span></span>
    </div>
    <div class="flex space-x-4 text-sm font-semibold">
      <a href="/dashboard" class="text-slate-400 hover:text-white transition">Dashboard</a>
      <a href="/registration" class="text-slate-400 hover:text-white transition">Registration</a>
      <a href="/profile" class="text-red-400 border-b-2 border-red-500 pb-0.5">Profile</a>
    </div>
  </nav>

  <!-- Main Profile Lookup Section -->
  <div class="flex-1 flex flex-col justify-center items-center p-6">
    <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-8 max-w-lg w-full shadow-2xl space-y-6">
      <div class="border-b border-slate-700 pb-4">
        <h2 class="text-xl font-bold text-slate-100">Search Device Profile</h2>
        <p class="text-xs text-slate-400 mt-1">Lookup registered medical details by entering a hardware node ID.</p>
      </div>

      <div class="flex space-x-2">
        <input type="text" id="searchDeviceId" placeholder="Enter Device ID (e.g. ESP32-NODE-01)" 
          class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 text-sm">
        <button onclick="fetchProfile()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2.5 rounded-lg text-sm transition">
          Search
        </button>
      </div>

      <!-- Result Card -->
      <div id="profileResult" class="hidden bg-slate-900 border border-slate-700/80 rounded-lg p-5 space-y-3 text-sm">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <span class="text-xs uppercase font-bold text-slate-400">Device ID</span>
          <span id="resDeviceId" class="font-bold text-red-400"></span>
        </div>
        <div>
          <span class="text-xs text-slate-400 block">Victim Name:</span>
          <span id="resName" class="font-semibold text-slate-100 text-base"></span>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <span class="text-xs text-slate-400 block">Blood Group:</span>
            <span id="resBlood" class="font-semibold text-slate-200"></span>
          </div>
          <div>
            <span class="text-xs text-slate-400 block">Emergency Contact:</span>
            <span id="resContact" class="font-semibold text-slate-200"></span>
          </div>
        </div>
        <div>
          <span class="text-xs text-slate-400 block">Critical Allergies / Notes:</span>
          <span id="resNotes" class="text-slate-300 italic"></span>
        </div>
      </div>

      <div id="notFoundMsg" class="hidden text-center text-sm text-red-400 bg-red-500/10 border border-red-500/20 p-3 rounded-lg">
        No registered profile found for this Device ID.
      </div>
    </div>
  </div>

  <script>
    async function fetchProfile() {
      const devId = document.getElementById("searchDeviceId").value.trim();
      const resultCard = document.getElementById("profileResult");
      const notFoundMsg = document.getElementById("notFoundMsg");

      if (!devId) return;

      try {
        const res = await fetch(`/api/profile/${encodeURIComponent(devId)}`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById("resDeviceId").textContent = data.device_id;
          document.getElementById("resName").textContent = data.victim_name;
          document.getElementById("resBlood").textContent = data.blood_group;
          document.getElementById("resContact").textContent = data.emergency_contact;
          document.getElementById("resNotes").textContent = data.critical_allergies || "None";
          
          resultCard.classList.remove("hidden");
          notFoundMsg.classList.add("hidden");
        } else {
          resultCard.classList.add("hidden");
          notFoundMsg.classList.remove("hidden");
        }
      } catch (err) {
        console.error("Error fetching profile:", err);
      }
    }
  </script>
</body>
</html>
